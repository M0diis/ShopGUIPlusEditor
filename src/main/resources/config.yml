edit-menu:
  title: "&8» &2Editing &c%shop_id%&8/&c%item_id%"
  size: 54
  preview-slot: 22

  fill-item:
    material: "GREEN_STAINED_GLASS_PANE"
    name: "&r"
    lore:
      - ""

  buy-price-button:
    slot: 20
    material: "PAPER"
    name: "&aBuy price"
    lore:
      - "&8» &7Shop: &f%shop_id%"
      - "&8» &7Slot/Page: &f%item_slot%&7/&f%item_page%"
      - ""
      - "&8» &aCurrent buy price: &2%current_buy_price%"
      - "&8» &aNew buy price: &2%new_buy_price%"

  sell-price-button:
    slot: 24
    material: "PAPER"
    name: "&cSell price"
    lore:
      - "&8» &7Shop: &f%shop_id%"
      - "&8» &7Slot/Page: &f%item_slot%&7/&f%item_page%"
      - ""
      - "&8» &aCurrent sell price: &2%current_sell_price%"
      - "&8» &aNew sell price: &2%new_sell_price%"

  save-button:
    slot: 31
    material: "EMERALD"
    name: "&aSave item"
    lore:
      - "&8» &7Mode: &f%editor_mode%"
      - "&8» &7Buy: &f%new_buy_price%"
      - "&8» &7Sell: &f%new_sell_price%"
      - ""
      - "&7Click to save your changes."

  remove-button:
    slot: 40
    material: "LAVA_BUCKET"
    name: "&cRemove item"
    lore:
      - "&8» &7Item ID: &f%item_id%"
      - "&8» &7Shop: &f%shop_id%"
      - ""
      - "&7Click to remove this item from the shop."

  back-button:
    slot: 49
    material: "BARRIER"
    name: "&cBack"
    lore:
      - "&7Return to the shop page."

  sell-price-adjust-buttons:
    button-1:
      slot: 41
      size: 1
      name: "&c$%amount%"
      amount: 0.10
      shift-multiplier: 2
      material: "RED_CONCRETE"
      lore:
        - "&8» &aLeft click to add %amount%"
        - "&8» &aRight click to subtract %amount%"
        - ""
        - "&7Shift-click to multiply by %shift_multiplier%"
    button-2:
      slot: 42
      size: 2
      name: "&c$%amount%"
      amount: 1
      shift-multiplier: 2
      material: "RED_CONCRETE"
      lore:
        - "&8» &aLeft click to add %amount%"
        - "&8» &aRight click to subtract %amount%"
        - ""
        - "&7Shift-click to multiply by %shift_multiplier%"
    button-3:
      slot: 43
      size: 3
      name: "&c$%amount%"
      amount: 10
      shift-multiplier: 2
      material: "RED_CONCRETE"
      lore:
        - "&8» &aLeft click to add %amount%"
        - "&8» &aRight click to subtract %amount%"
        - ""
        - "&7Shift-click to multiply by %shift_multiplier%"

  buy-price-adjust-buttons:
    button-1:
      slot: 37
      size: 1
      name: "&a$%amount%"
      amount: 0.10
      shift-multiplier: 2
      material: "LIME_CONCRETE"
      lore:
        - "&8» &aLeft click to add %amount%"
