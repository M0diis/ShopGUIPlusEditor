name: ShopGUIPlusEditor
main: me.m0dii.shopguipluseditor.ShopGUIPlusEditor
description: ShopGUIPlus editor with price, add, and remove tooling.
version: 2.1.0
api-version: "26.2"
author: M0dii
depend: [ShopGUIPlus]
commands:
  shopguipluseditor:
    description: Main command.
    aliases: [sgpe, sge, shopguieditor]
permissions:
  shopguipluseditor.use:
    description: Permission to open the in-shop editor.
    default: op
  shopguipluseditor.command.reload:
    description: Permission to reload the plugin config.
    default: op
  shopguipluseditor.command.add:
    description: Permission to open the add-item editor.
    default: op
  shopguipluseditor.command.edit:
    description: Permission to open the edit command editor.
    default: op
  shopguipluseditor.command.remove:
    description: Permission to remove shop items.
    default: op
